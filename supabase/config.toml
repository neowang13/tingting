project_id = "ting-ting-local-e2e"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = false

# Local Mailpit inbox for Supabase Auth confirmation messages.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/client/auth/confirm",
  "http://localhost:3000/client/auth/recover",
  "http://127.0.0.1:3000/client/auth/confirm",
  "http://127.0.0.1:3000/client/auth/recover",
  "http://localhost:3300/client/auth/confirm",
  "http://localhost:3300/client/auth/recover",
  "http://127.0.0.1:3300/admin",
  "http://127.0.0.1:3300/client/auth/confirm",
  "http://127.0.0.1:3300/client/auth/recover",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 11

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
