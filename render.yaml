services:
  # Free Web-only demo blueprint. Render Cron has no free tier, so scheduled
  # processing is intentionally omitted until the owner approves paid
  # production infrastructure. Outbound providers remain disabled.
  - type: web
    name: tingting-real-estate
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_BACKEND
        value: supabase
      - key: NEXT_PUBLIC_APP_MODE
        value: production
      - key: DEFAULT_TIMEZONE
        value: America/Vancouver
      - key: APP_BASE_URL
        value: https://tingting-real-estate.onrender.com
      - key: REMINDERS_FORCE_PAUSED
        value: "true"
      - key: EMAIL_PROVIDER_MODE
        value: disabled
      - key: SMS_PROVIDER_MODE
        value: disabled
      - key: AUTOMATION_API_ENABLED
        value: "false"
      - key: AUTOMATION_MUTATIONS_ENABLED
        value: "false"
      - key: AUTOMATION_CONFIRMATIONS_ENABLED
        value: "false"
      - key: AUTOMATION_TENANT_IMPORT_ENABLED
        value: "false"
      - key: AUTOMATION_IMPORT_BUCKET
        value: automation-imports
      - key: SUPABASE_STORAGE_PUBLIC_BUCKET
        value: site-media
      - key: SUPABASE_STORAGE_DRAFT_BUCKET
        value: site-media-drafts
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Required by the authenticated manual demo trigger. The owner enters a
      # random value of at least 24 characters directly in Render.
      - key: REMINDER_CRON_SECRET
        sync: false
