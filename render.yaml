services:
  # Provisioning blueprint only. It does not deploy by itself and outbound
  # providers remain disabled until an owner explicitly changes the mode.
  - type: web
    name: tingting-real-estate
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_BACKEND
        value: supabase
      - key: NEXT_PUBLIC_APP_MODE
        value: production
      - key: DEFAULT_TIMEZONE
        value: America/Vancouver
      - key: REMINDERS_FORCE_PAUSED
        value: "true"
      # Keep each outbound channel disabled until its provider has been
      # provisioned and an authorized production dry run has passed.
      - key: EMAIL_PROVIDER_MODE
        value: disabled
      - key: SMS_PROVIDER_MODE
        value: disabled
      - key: AUTOMATION_API_ENABLED
        value: "false"
      - key: AUTOMATION_MUTATIONS_ENABLED
        value: "false"
      - key: AUTOMATION_CONFIRMATIONS_ENABLED
        value: "false"
      - key: AUTOMATION_TENANT_IMPORT_ENABLED
        value: "false"
      - key: AUTOMATION_IMPORT_BUCKET
        value: automation-imports
      - key: SUPABASE_STORAGE_PUBLIC_BUCKET
        value: site-media
      - key: SUPABASE_STORAGE_DRAFT_BUCKET
        value: site-media-drafts
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REMINDER_CRON_SECRET
        sync: false
      - key: AUTOMATION_TOKEN_PEPPER
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
      - key: ALERT_TO_EMAIL
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_STATUS_CALLBACK_URL
        sync: false
  - type: cron
    name: tingting-reminder-cron
    runtime: node
    plan: starter
    region: oregon
    schedule: "*/5 * * * *"
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm exec tsx scripts/invoke-reminder-cron.ts
    autoDeployTrigger: commit
    envVars:
      # Enter the exact same public HTTPS URL and Cron secret used by the web
      # service. The command never prints the secret or response body.
      - key: APP_BASE_URL
        sync: false
      - key: REMINDER_CRON_SECRET
        sync: false
