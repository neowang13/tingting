services:
  # Paid production blueprint. The current free web deployment uses
  # render.yaml with the same application feature flags.
  - type: web
    name: tingting-real-estate
    runtime: node
    plan: starter
    region: oregon
    buildCommand: NODE_ENV=development pnpm install --frozen-lockfile && NODE_ENV=production pnpm build
    startCommand: pnpm exec next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_BACKEND
        value: supabase
      - key: NEXT_PUBLIC_APP_MODE
        value: production
      - key: DEFAULT_TIMEZONE
        value: America/Vancouver
      - key: REMINDERS_FORCE_PAUSED
        value: "false"
      - key: EMAIL_PROVIDER_MODE
        value: live
      - key: SMS_PROVIDER_MODE
        value: disabled
      - key: AUTOMATION_API_ENABLED
        value: "false"
      - key: AUTOMATION_MUTATIONS_ENABLED
        value: "false"
      - key: AUTOMATION_CONFIRMATIONS_ENABLED
        value: "false"
      - key: AUTOMATION_TENANT_IMPORT_ENABLED
        value: "false"
      - key: AUTOMATION_IMPORT_BUCKET
        value: automation-imports
      - key: SUPABASE_STORAGE_PUBLIC_BUCKET
        value: site-media
      - key: SUPABASE_STORAGE_DRAFT_BUCKET
        value: site-media-drafts
      - key: APPLICATION_UPLOAD_BUCKET
        value: client-applications
      - key: APPLICATION_GUEST_SESSION_SECRET
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REMINDER_CRON_SECRET
        sync: false
      - key: AUTOMATION_TOKEN_PEPPER
        sync: false
      - key: APP_BASE_URL
        value: https://silverkey.ca
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Ting Ting Xu <notifications@silverkey.ca>
      - key: CONTACT_TO_EMAIL
        value: info@silverkey.ca
      - key: APPLICATION_TO_EMAIL
        value: info@silverkey.ca
      - key: ALERT_TO_EMAIL
        value: info@silverkey.ca
      - key: OPERATIONAL_ALERTS_ENABLED
        value: "false"
      - key: OWNER_NOTIFICATION_TO_EMAIL
        value: info@silverkey.ca
      - key: OWNER_DAILY_OVERDUE_ENABLED
        value: "false"
      - key: OWNER_DAILY_OVERDUE_TIME
        value: "09:00"
      - key: OWNER_WEEKLY_SUMMARY_ENABLED
        value: "false"
      - key: OWNER_WEEKLY_SUMMARY_DAY
        value: "1"
      - key: OWNER_WEEKLY_SUMMARY_TIME
        value: "09:00"
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_STATUS_CALLBACK_URL
        sync: false
  - type: cron
    name: tingting-reminder-cron
    runtime: node
    plan: starter
    region: oregon
    schedule: "*/5 * * * *"
    buildCommand: NODE_ENV=development pnpm install --frozen-lockfile
    startCommand: pnpm exec tsx scripts/invoke-reminder-cron.ts
    autoDeployTrigger: commit
    envVars:
      # Enter the exact same public HTTPS URL and Cron secret used by the web
      # service. The command never prints the secret or response body.
      - key: APP_BASE_URL
        value: https://silverkey.ca
      - key: REMINDER_CRON_SECRET
        sync: false
